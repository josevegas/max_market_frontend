<div class="min-h-screen flex flex-col bg-slate-50 dark:bg-surface">
  <app-header (toggleSidebar)="toggleSidebar()" />

  <div class="flex flex-1 overflow-hidden relative">
    @if (sidebarAbierto()) {
      <button
        type="button"
        (click)="cerrarSidebarMobile()"
        class="lg:hidden fixed inset-0 top-14 bg-black/40 z-30"
        aria-label="Cerrar menú"
      ></button>
    }

    <app-sidebar [abierto]="sidebarAbierto()" (linkClick)="cerrarSidebarMobile()" />

    <main class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8">
      <router-outlet />
    </main>
  </div>

  <p-toast />
  <p-confirmdialog />
</div>
